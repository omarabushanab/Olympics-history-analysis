[project]
name = "olympics-history-analysis"
version = "0.1.0"
description = "Olympic Games historical data analysis and visualization"
authors = [
    { name = "omarabushanab" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.2.0",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]